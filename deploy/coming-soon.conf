# /etc/nginx/sites-available/coming-soon.conf
#
# Un solo sitio estatico servido bajo varios dominios del grupo mientras
# se reestructura cada uno. Agregar un dominio nuevo es una linea en
# server_name mas su registro DNS en Cloudflare (ver README.md).
#
# El root apunta al resultado de `npm run build` (dist/), no a public/:
# public/ son los archivos fuente que Astro copia tal cual, dist/ es el
# sitio compilado con el HTML y el CSS ya generados.
#
# Cloudflare esta en modo "Flexible" para partir: el visitante habla HTTPS
# con Cloudflare y Cloudflare habla HTTP plano con este servidor. Por eso
# este bloque escucha solo en el puerto 80. Migrar a Full (strict) despues
# es agregar un certificado de origen y un segundo server{} en :443.

server {
    listen 80;
    listen [::]:80;

    # Agregar aqui cada dominio/subdominio que deba mostrar el placeholder.
    server_name
        grupolasgarzas.cl www.grupolasgarzas.cl
        aridosaconcagua.cl www.aridosaconcagua.cl
        # otrodominio.cl www.otrodominio.cl
        ;

    root /var/www/coming-soon/dist;
    index index.html;

    # Restringir el origen solo a Cloudflare (opcional, activar cuando se
    # confirme que ningun otro servicio necesita llegar por IP directa).
    # Rangos actualizados en https://www.cloudflare.com/ips/
    # include /etc/nginx/snippets/cloudflare-only.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Assets con nombre estable: cache larga en el origen.
    # Al reemplazar la imagen o el video hay que purgar el cache de
    # Cloudflare, porque con este TTL el cambio no se refleja solo.
    location ~* \.(webp|jpg|jpeg|png|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # El video se sirve por rangos: sin accept_ranges el navegador no
    # puede empezar a reproducir antes de descargarlo entero.
    location /video/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/html text/css application/javascript image/svg+xml;
    # No comprimir mp4/webp: ya vienen comprimidos, gzip solo gasta CPU.
}
